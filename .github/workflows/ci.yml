name: CI

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  php-lint:
    name: Revisar sintaxis PHP (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pdo, pdo_mysql
          coverage: none

      - name: Revisar sintaxis de todos los archivos .php
        run: |
          errores=0
          while IFS= read -r -d '' archivo; do
            if ! php -l "$archivo" > /dev/null; then
              echo "::error file=$archivo::Error de sintaxis en $archivo"
              errores=1
            fi
          done < <(find . -type f -name "*.php" -not -path "./vendor/*" -print0)
          exit $errores

  node-check:
    name: Revisar bot.js
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (si existe package.json)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No hay package.json, se omite la instalación"
          fi

      - name: Revisar sintaxis de bot.js
        run: node --check bot.js