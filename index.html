<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Almacén ERA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .options { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .forgot-link { color: #3b82f6; text-decoration: none; font-size: 0.85rem; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; cursor: pointer; color: #94a3b8; }
        .step-container { display: none; }
        .step-active { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-boxes-stacked logo-icon"></i>
                <h1>Almacén ERA</h1>
                <p>Control de Entradas y Salidas</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="email" name="correo" placeholder="usuario@correo.com" required />
                    </div>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="••••••••" required />
                    </div>
                </div>
                <div class="options">
                    <a class="forgot-link" onclick="openRecoverModal()">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">Acceder al Sistema</button>
            </form>
        </div>
    </div>

    <div id="modalRecover" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeRecoverModal()"><i class="fas fa-times"></i></span>
            
            <div id="step1" class="step-container step-active">
                <h3>Recuperar Acceso</h3>
                <p>Ingresa tu correo para buscar tu pregunta de seguridad.</p>
                <div class="input-group">
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email_verify" placeholder="correo@ejemplo.com">
                    </div>
                </div>
                <button onclick="verificarCorreo()" class="btn-login" style="margin-top:15px;">Siguiente</button>
            </div>

            <div id="step2" class="step-container">
                <h3 id="txtPregunta" style="margin-bottom: 10px; color: #1e293b;">...</h3>
                <div class="input-group">
                    <div class="input-field">
                        <i class="fas fa-comment-dots"></i>
                        <input type="text" id="respuesta_user" placeholder="Tu respuesta">
                    </div>
                </div>
                <button onclick="verificarRespuesta()" class="btn-login" style="margin-top:15px;">Validar Respuesta</button>
            </div>

            <div id="step3" class="step-container">
                <h3>Nueva Contraseña</h3>
                <p>Ingresa tu nueva clave de acceso.</p>
                <div class="input-group">
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="new_pass_recover" placeholder="Mínimo 6 caracteres">
                    </div>
                </div>
                <button onclick="cambiarClaveFinal()" class="btn-login" style="margin-top:15px; background: #10b981;">Restablecer</button>
            </div>
        </div>
    </div>

    <script>
        // LOGIN
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';
            const formData = new FormData(e.target);
            const res = await fetch('login_process.php', { method: 'POST', body: formData });
            const result = await res.json();
            if (result.status === "success") window.location.href = "dashboard.php";
            else { alert(result.message); btn.innerHTML = 'Acceder al Sistema'; }
        };

        // RECUPERACIÓN
        let correoGlobal = "";
        function openRecoverModal() { document.getElementById('modalRecover').style.display = 'flex'; }
        function closeRecoverModal() { document.getElementById('modalRecover').style.display = 'none'; }

        async function verificarCorreo() {
            correoGlobal = document.getElementById('email_verify').value;
            const res = await fetch(`recover_method.php?accion=get_pregunta&correo=${correoGlobal}`);
            const data = await res.json();
            if (data.status === "success") {
                document.getElementById('txtPregunta').innerText = data.pregunta;
                document.getElementById('step1').classList.remove('step-active');
                document.getElementById('step2').classList.add('step-active');
            } else alert(data.message);
        }

        async function verificarRespuesta() {
            const resp = document.getElementById('respuesta_user').value;
            const res = await fetch(`recover_method.php?accion=verificar_resp&correo=${correoGlobal}&resp=${resp}`);
            const data = await res.json();
            if (data.status === "success") {
                document.getElementById('step2').classList.remove('step-active');
                document.getElementById('step3').classList.add('step-active');
            } else alert("Respuesta incorrecta");
        }

        async function cambiarClaveFinal() {
            const pass = document.getElementById('new_pass_recover').value;
            const res = await fetch(`recover_method.php?accion=cambiar_pass&correo=${correoGlobal}&pass=${pass}`);
            const data = await res.json();
            if (data.status === "success") { alert("¡Clave actualizada!"); location.reload(); }
        }
    </script>
</body>
</html>
